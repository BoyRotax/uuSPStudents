<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - ระบบจัดการเรียนพิเศษ (SPStudents)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { 
            font-family: 'Sarabun', sans-serif; 
            background: linear-gradient(135deg, #e0e7ff 0%, #c7d2fe 100%); /* ธีมสีม่วงคราม */
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(67, 56, 202, 0.15);
            overflow: hidden;
            width: 100%;
            max-width: 450px;
            padding: 40px;
        }
        .icon-circle {
            width: 80px;
            height: 80px;
            background: #4f46e5; /* สีม่วงเข้ม */
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
            margin: 0 auto 20px;
            box-shadow: 0 10px 20px rgba(79, 70, 229, 0.3);
        }
        .form-control {
            border-radius: 10px;
            padding: 12px 20px;
            border: 1px solid #cbd5e1;
        }
        .form-control:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 0.25rem rgba(79, 70, 229, 0.25);
        }
        .btn-login {
            background-color: #4f46e5;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-size: 18px;
            font-weight: 600;
            color: white;
            transition: all 0.3s;
        }
        .btn-login:hover {
            background-color: #4338ca;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(67, 56, 202, 0.4);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="login-card text-center">
                    <div class="icon-circle">
                        <i class="fas fa-book-reader"></i>
                    </div>
                    <h4 class="fw-bold text-dark mb-1">ระบบจัดการเรียนพิเศษ</h4>
                    <p class="text-muted mb-4">ศพด. ทับกวาง (ป่าไผ่)</p>

                    <form id="loginForm" onsubmit="event.preventDefault(); login();">
                        <div class="mb-3 text-start">
                            <label class="form-label fw-bold text-secondary small">ชื่อผู้ใช้ (Username)</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="fas fa-user text-muted"></i></span>
                                <input type="text" id="username" class="form-control" placeholder="กรอกชื่อผู้ใช้" required>
                            </div>
                        </div>

                        <div class="mb-4 text-start">
                            <label class="form-label fw-bold text-secondary small">รหัสผ่าน (Password)</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="fas fa-lock text-muted"></i></span>
                                <input type="password" id="password" class="form-control" placeholder="กรอกรหัสผ่าน" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-login w-100 mb-3" id="btnLogin">
                            <i class="fas fa-sign-in-alt me-2"></i> เข้าสู่ระบบ
                        </button>
                    </form>
                    
                    <a href="https://boyrotax.github.io/PapaiTK/" class="text-decoration-none small text-indigo fw-bold">
                        <i class="fas fa-arrow-left me-1"></i> กลับไปหน้าระบบภาคปกติ
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        // ⚠️ เอา Web App URL เดิม (โกดังเดิม) มาใส่ตรงนี้เลยครับ ⚠️
        const scriptURL = 'https://script.google.com/macros/s/AKfycbzoIkW_e_OeG-pW4_5vBUrLI64xwmVEXjKQxVifUjUWn7QrwY1TVd9Zdj7UwMPRng5I_w/exec';

        function login() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            const btn = document.getElementById('btnLogin');

            if(!user || !pass) return;

            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> กำลังตรวจสอบ...';
            btn.disabled = true;

            // ใช้ action=login อันเดิมกับของ PapaiTK ได้เลย!
            fetch(`${scriptURL}?action=login&username=${encodeURIComponent(user)}&password=${encodeURIComponent(pass)}`)
            .then(res => res.json())
            .then(data => {
                if(data.status === "success") {
                    // เก็บ Session แยกกัน
                    sessionStorage.setItem('isSpLoggedIn', 'true');
                    sessionStorage.setItem('spUserName', data.name);
                    sessionStorage.setItem('spUserRole', data.role);
                    
                    Swal.fire({
                        icon: 'success',
                        title: 'เข้าสู่ระบบสำเร็จ',
                        text: `ยินดีต้อนรับ ${data.name}`,
                        timer: 1500,
                        showConfirmButton: false
                    }).then(() => {
                        // เปลี่ยนหน้าไปหน้าลงทะเบียนเรียนพิเศษ (เดี๋ยวเราจะสร้างหน้านี้กัน)
                        window.location.href = 'sp_dashboard.html'; 
                    });
                } else {
                    Swal.fire('ผิดพลาด', data.msg || 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง', 'error');
                }
            })
            .catch(err => {
                Swal.fire('ข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อระบบได้ กรุณาลองใหม่', 'error');
            })
            .finally(() => {
                btn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i> เข้าสู่ระบบ';
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
