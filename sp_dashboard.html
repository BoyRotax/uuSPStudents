<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แดชบอร์ด - ระบบจัดการเรียนพิเศษ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; }
        .sidebar { background: #312e81; color: white; min-height: 100vh; padding-top: 20px; }
        .sidebar a { color: #c7d2fe; text-decoration: none; padding: 12px 20px; display: block; font-weight: 600; transition: 0.3s; }
        .sidebar a:hover, .sidebar a.active { color: white; background: #4338ca; border-left: 4px solid #818cf8; }
        .nav-tabs .nav-link { color: #64748b; font-weight: 600; border-radius: 10px 10px 0 0; }
        .nav-tabs .nav-link.active { color: #4f46e5; background-color: #f8fafc; border-bottom: 2px solid #f8fafc; }
        .card-box { background: white; border-radius: 0 15px 15px 15px; border: 1px solid #dee2e6; border-top: none; }
        .badge-tk { background-color: #10b981; color: white; }
        .badge-ex { background-color: #f59e0b; color: white; }
    </style>
</head>
<body>

<script>
    if (sessionStorage.getItem('isSpLoggedIn') !== 'true') { window.location.href = 'index.html'; }
</script>

<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 sidebar d-none d-md-block">
            <div class="text-center mb-4">
                <i class="fas fa-book-reader fa-3x text-info mb-2"></i>
                <h6 class="text-light fw-bold">SPStudents</h6>
                <small class="text-indigo-200">เรียนพิเศษ ศพด.ทับกวาง</small>
            </div>
            <a href="sp_dashboard.html" class="active"><i class="fas fa-list-alt me-2"></i> จัดการนักเรียน</a>
            <hr class="text-secondary">
            <a href="#" onclick="logout()" class="text-danger"><i class="fas fa-sign-out-alt me-2"></i> ออกจากระบบ</a>
        </div>

        <div class="col-md-10 p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="fw-bold text-indigo" style="color: #4f46e5;"><i class="fas fa-graduation-cap"></i> ระบบลงทะเบียนเรียนพิเศษ</h3>
                <div class="badge bg-primary fs-6 p-2 rounded-pill shadow-sm" style="background-color: #4f46e5 !important;">
                    <i class="fas fa-chalkboard-teacher me-1"></i> ครู: <span id="displayUserName">กำลังโหลด...</span>
                </div>
            </div>

            <ul class="nav nav-tabs" id="myTab" role="tablist">
                <li class="nav-item"><button class="nav-link active" id="list-tab" data-bs-toggle="tab" data-bs-target="#list" type="button"><i class="fas fa-users me-1"></i> รายชื่อเด็กที่เรียนพิเศษ</button></li>
                <li class="nav-item"><button class="nav-link" id="add-tk-tab" data-bs-toggle="tab" data-bs-target="#add-tk" type="button"><i class="fas fa-search-plus me-1"></i> ดึงข้อมูลจาก ศพด. เดิม</button></li>
                <li class="nav-item"><button class="nav-link" id="add-ex-tab" data-bs-toggle="tab" data-bs-target="#add-ex" type="button"><i class="fas fa-user-plus me-1"></i> เพิ่มเด็กจากภายนอก</button></li>
            </ul>

            <div class="tab-content card-box p-4" id="myTabContent">
                
                <div class="tab-pane fade show active" id="list" role="tabpanel">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="fw-bold text-dark">นักเรียนที่ลงทะเบียนแล้ว</h5>
                        <button class="btn btn-outline-primary btn-sm" onclick="loadSpecialStudents()"><i class="fas fa-sync-alt"></i> รีเฟรช</button>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle text-center">
                            <thead class="table-light">
                                <tr>
                                    <th>รหัส</th>
                                    <th>ประเภท</th>
                                    <th class="text-start">ชื่อ-สกุล</th>
                                    <th>ระดับชั้น</th>
                                    <th>เบอร์โทร</th>
                                    <th class="text-primary">เวลาเรียน</th>
                                </tr>
                            </thead>
                            <tbody id="spStudentBody">
                                <tr><td colspan="6" class="text-center text-muted">กำลังโหลดข้อมูล...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="tab-pane fade" id="add-tk" role="tabpanel">
                    <h5 class="fw-bold text-dark mb-3">ค้นหานักเรียนใน ศพด. ทับกวาง</h5>
                    <div class="row g-3 mb-4">
                        <div class="col-md-4">
                            <select id="filterClass" class="form-select">
                                <option value="">-- เลือกระดับชั้น --</option>
                                <option value="เตรียมอนุบาล">เตรียมอนุบาล</option>
                                <option value="อนุบาล 1">อนุบาล 1</option>
                                <option value="อนุบาล 2">อนุบาล 2</option>
                                <option value="อนุบาล 3">อนุบาล 3</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <select id="filterRoom" class="form-select">
                                <option value="">-- เลือกห้อง (ถ้ามี) --</option>
                                <option value="1">ห้อง 1</option>
                                <option value="2">ห้อง 2</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <button class="btn btn-primary w-100" style="background-color: #4f46e5;" onclick="fetchTkStudents()">
                                <i class="fas fa-search"></i> ค้นหา
                            </button>
                        </div>
                    </div>
                    
                    <div class="table-responsive d-none" id="tkSearchTable">
                        <table class="table table-bordered align-middle text-center">
                            <thead class="table-light">
                                <tr>
                                    <th>รหัส</th>
                                    <th class="text-start">ชื่อ-สกุล</th>
                                    <th>ระดับชั้น</th>
                                    <th style="min-width: 200px;">เลือกรอบเวลาเรียน</th>
                                </tr>
                            </thead>
                            <tbody id="tkStudentBody"></tbody>
                        </table>
                    </div>
                </div>

                <div class="tab-pane fade" id="add-ex" role="tabpanel">
                    <h5 class="fw-bold text-dark mb-3">ลงทะเบียนนักเรียนภายนอก</h5>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label fw-bold">ชื่อ-นามสกุล <span class="text-danger">*</span></label>
                                <input type="text" id="exName" class="form-control" placeholder="เช่น เด็กหญิงใจดี รักเรียน">
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">ระดับชั้น / อายุ <span class="text-danger">*</span></label>
                                <input type="text" id="exClass" class="form-control" placeholder="เช่น อนุบาล 2 หรือ อายุ 4 ขวบ">
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">เบอร์โทรติดต่อผู้ปกครอง <span class="text-danger">*</span></label>
                                <input type="text" id="exTel" class="form-control" placeholder="08X-XXX-XXXX">
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-bold text-primary">เลือกรอบเวลาเรียน <span class="text-danger">*</span></label>
                                <select id="exTimeSlot" class="form-select border-primary">
                                    <option value="จ.-พฤ. 14:30 - 15:30">จันทร์ - พฤหัส (14:30 - 15:30)</option>
                                    <option value="จ.-พฤ. 17:00 - 18:00">จันทร์ - พฤหัส (17:00 - 18:00)</option>
                                    <option value="ส. 09:00 - 11:00">เสาร์ (09:00 - 11:00)</option>
                                </select>
                            </div>
                            <button class="btn btn-warning fw-bold w-100" onclick="registerExternal()">
                                <i class="fas fa-save"></i> บันทึกข้อมูลเด็กภายนอก
                            </button>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
    // ⚠️⚠️ เอาลิงก์ Google Script มาวางตรงนี้ให้เรียบร้อย! ⚠️⚠️
    const scriptURL = 'https://script.google.com/macros/s/AKfycbyagDKJpTH0NTnHhMsHUtZmuhNk8AlyeeTBPa90xR9ezHdp9mncc1jf2GrP5b9TjD9dSQ/exec'; 

    document.getElementById('displayUserName').innerText = sessionStorage.getItem('spUserName') || 'ผู้สอนพิเศษ';

    function logout() { sessionStorage.clear(); window.location.href = 'index.html'; }

    $(document).ready(function() { loadSpecialStudents(); });

    function loadSpecialStudents() {
        fetch(scriptURL + '?action=getSpecialStudents')
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById('spStudentBody');
                tbody.innerHTML = '';
                if(!data || data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">ยังไม่มีข้อมูลนักเรียน</td></tr>';
                    return;
                }
                data.forEach(s => {
                    const badgeClass = s.StudentType === "เด็กใน ศพด." ? "badge-tk" : "badge-ex";
                    tbody.innerHTML += `
                        <tr>
                            <td class="fw-bold">${s.StudentId}</td>
                            <td><span class="badge ${badgeClass}">${s.StudentType}</span></td>
                            <td class="text-start fw-bold">${s.FullName} <br><small class="text-muted">(${s.NickName})</small></td>
                            <td>${s.ClassLevel} ${s.Room && s.Room !== '-' ? '(ห้อง '+s.Room+')' : ''}</td>
                            <td>${s.Tel}</td>
                            <td class="text-primary fw-bold">${s.TimeSlot || '-'}</td>
                        </tr>
                    `;
                });
            }).catch(err => {
                console.error("Error loading students:", err);
                document.getElementById('spStudentBody').innerHTML = '<tr><td colspan="6" class="text-center text-danger">ไม่สามารถดึงข้อมูลได้ (เช็ค URL หลังบ้าน)</td></tr>';
            });
    }

    function fetchTkStudents() {
        const cls = document.getElementById('filterClass').value;
        const rm = document.getElementById('filterRoom').value;
        if (!cls) return Swal.fire('แจ้งเตือน', 'เลือกระดับชั้นก่อนครับ', 'warning');

        Swal.fire({ title: 'กำลังดึงข้อมูล...', didOpen: () => { Swal.showLoading() }});

        fetch(scriptURL + '?action=getStudents')
            .then(res => res.json())
            .then(data => {
                const filtered = data.filter(s => s.ClassLevel === cls && (rm === "" || String(s.Room) === String(rm)));
                const tbody = document.getElementById('tkStudentBody');
                tbody.innerHTML = '';
                
                if(filtered.length === 0) {
                    Swal.fire('ไม่พบข้อมูล', 'ไม่มีนักเรียนในห้องนี้', 'info');
                    document.getElementById('tkSearchTable').classList.add('d-none');
                    return;
                }

                filtered.forEach(s => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${s.StudentId}</td>
                            <td class="text-start fw-bold">${s.FullName}</td>
                            <td>${s.ClassLevel}</td>
                            <td>
                                <select id="time_${s.StudentId}" class="form-select form-select-sm mb-2 border-primary">
                                    <option value="จ.-พฤ. 14:30 - 15:30">จ.-พฤ. 14:30 - 15:30</option>
                                    <option value="จ.-พฤ. 17:00 - 18:00">จ.-พฤ. 17:00 - 18:00</option>
                                    <option value="ส. 09:00 - 11:00">ส. 09:00 - 11:00</option>
                                </select>
                                <button class="btn btn-sm btn-success fw-bold w-100" onclick="registerInternal('${s.StudentId}', '${s.FullName}', '${s.NickName}', '${s.ClassLevel}', '${s.Room}', '${s.FatherTel || s.MotherTel || '-'}', this)">
                                    <i class="fas fa-plus"></i> เพิ่มเข้าเรียนพิเศษ
                                </button>
                            </td>
                        </tr>
                    `;
                });
                document.getElementById('tkSearchTable').classList.remove('d-none');
                Swal.close();
            }).catch(err => {
                Swal.fire('ผิดพลาด', 'ดึงข้อมูลไม่ได้ กรุณาตรวจสอบ URL หรือการตั้งค่า Deployment', 'error');
                console.error(err);
            });
    }

    function registerInternal(sId, fName, nName, cls, rm, tel, btnElem) {
        // 🌟 ดึงค่าเวลาที่เลือกจาก Dropdown มา
        const selectedTime = document.getElementById(`time_${sId}`).value;
        
        const payload = {
            studentId: sId,
            fullName: fName,
            nickName: nName,
            classLevel: cls,
            room: rm,
            studentType: 'เด็กใน ศพด.',
            tel: tel,
            timeSlot: selectedTime
        };

        btnElem.innerHTML = '<i class="fas fa-spinner fa-spin"></i> รอสักครู่...';
        btnElem.disabled = true;
        
        fetch(scriptURL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: 'action=saveSpecialStudent&data=' + encodeURIComponent(JSON.stringify(payload))
        })
        .then(res => res.json())
        .then(data => {
            if(data.status === "success") {
                btnElem.classList.replace('btn-success', 'btn-secondary');
                btnElem.innerHTML = '<i class="fas fa-check"></i> ลงทะเบียนแล้ว';
                loadSpecialStudents();
                Swal.fire({ icon: 'success', title: 'เพิ่มสำเร็จ', timer: 1500, showConfirmButton: false });
            } else {
                Swal.fire('แจ้งเตือน', data.msg, 'error');
                btnElem.innerHTML = '<i class="fas fa-plus"></i> เพิ่มเข้าเรียนพิเศษ';
                btnElem.disabled = false;
            }
        });
    }

    function registerExternal() {
        const payload = {
            fullName: document.getElementById('exName').value.trim(),
            nickName: "", 
            classLevel: document.getElementById('exClass').value.trim(),
            studentType: 'เด็กภายนอก',
            tel: document.getElementById('exTel').value.trim(),
            timeSlot: document.getElementById('exTimeSlot').value // 🌟 ดึงเวลาที่เลือกมา
        };

        if(!payload.fullName || !payload.classLevel || !payload.tel) {
            return Swal.fire('กรอกข้อมูลไม่ครบ', 'กรุณากรอกช่องที่มีเครื่องหมาย * ให้ครบถ้วนครับ', 'warning');
        }

        Swal.fire({ title: 'กำลังบันทึก...', didOpen: () => { Swal.showLoading() }});

        fetch(scriptURL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: 'action=saveSpecialStudent&data=' + encodeURIComponent(JSON.stringify(payload))
        })
        .then(res => res.json())
        .then(data => {
            if(data.status === "success") {
                Swal.fire('สำเร็จ!', 'บันทึกเด็กภายนอกเข้าระบบแล้ว (รหัส EX จะถูกสร้างอัตโนมัติ)', 'success');
                document.getElementById('exName').value = '';
                document.getElementById('exClass').value = '';
                document.getElementById('exTel').value = '';
                
                loadSpecialStudents();
                var triggerEl = document.querySelector('#myTab button[data-bs-target="#list"]');
                bootstrap.Tab.getInstance(triggerEl).show();
            } else {
                Swal.fire('ผิดพลาด', data.msg, 'error');
            }
        });
    }
</script>
</body>
</html>
